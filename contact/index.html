<script>
  const toggle = document.querySelector('.hdr-toggle');
  const mobNav = document.querySelector('.mob-nav');
  toggle.addEventListener('click', function() { mobNav.classList.toggle('open'); });
  document.addEventListener('click', function(e) {
    if (!mobNav.contains(e.target) && !toggle.contains(e.target)) mobNav.classList.remove('open');
  });
  mobNav.querySelectorAll('a').forEach(function(link) {
    link.addEventListener('click', function() { mobNav.classList.remove('open'); });
  });
  mobNav.querySelectorAll('.mob-sub-parent').forEach(function(parent) {
    parent.addEventListener('click', function(e) {
      e.stopPropagation();
      var items = this.nextElementSibling;
      if (items && items.classList.contains('mob-sub-items')) {
        items.classList.toggle('open');
        this.classList.toggle('open');
      }
    });
  });
  const scrollBtn = document.querySelector('.scroll-top');
  window.addEventListener('scroll', function() {
    mobNav.classList.remove('open');
    scrollBtn.classList.toggle('visible', window.scrollY > 400);
  });
  scrollBtn.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });

<script>

<script>
var faqItems = document.querySelectorAll('.faq-item');
faqItems.forEach(function(item) {
  var button = item.querySelector('.faq-toggle');
  var answer = item.querySelector('.faq-answer');
  if (!button || !answer) return;
  button.addEventListener('click', function() {
    var isOpen = item.classList.contains('open');
    faqItems.forEach(function(other) {
      other.classList.remove('open');
      var b = other.querySelector('.faq-toggle');
      var a = other.querySelector('.faq-answer');
      if (b) b.setAttribute('aria-expanded', 'false');
      if (a) a.setAttribute('aria-hidden', 'true');
    });
    if (!isOpen) {
      item.classList.add('open');
      button.setAttribute('aria-expanded', 'true');
      answer.setAttribute('aria-hidden', 'false');
    }
  });
});
